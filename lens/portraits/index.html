<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Selected portrait photography by Siman Liu."
    />
    <title>Portrait Photography | Siman Liu</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/assets/js/main.js" defer></script>
  </head>
  <body class="portrait-page">
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="/">
          <span class="brand-name">Siman Liu</span>
          <span class="brand-mark">Research + Visual Storytelling</span>
        </a>
        <button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="site-navigation"
        >
          ☰
        </button>
        <nav class="site-nav" id="site-navigation" aria-label="Primary navigation"></nav>
      </div>
    </header>

    <main id="main">
      <section class="portrait-hero">
        <img
          src="/assets/images/portraits/portrait-01.jpg"
          alt="Close-up editorial portrait in warm, low-key light"
        />
        <div class="portrait-hero-shade" aria-hidden="true"></div>
        <div class="portrait-hero-copy">
          <ol class="breadcrumb">
            <li><a href="/">Home</a></li>
            <li><a href="/lens/">Through My Lens</a></li>
            <li>Portrait Photography</li>
          </ol>
          <h1>Portrait<br /><em>Studies</em></h1>
          <p>What a face says when it thinks no one’s watching.</p>
        </div>
      </section>

      <section class="portrait-series-compact" aria-label="Warm-light portrait photographs">
        <div class="portrait-first-gallery">
          <div class="portrait-fixed-grid">
            <figure>
              <img src="/assets/images/portraits/portrait-07.jpg" alt="Soft-focus portrait through warm foreground color" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-02.jpg" alt="Profile portrait in warm light" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-06.jpg" alt="Portrait with red lipstick and small flowers" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-10.jpg" alt="Layered mirror portrait in warm light" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-09.jpg" alt="Direct-gaze close-up portrait with flowers" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-11.jpg" alt="Smiling cropped portrait in a green dress" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-04.jpg" alt="Experimental reflected portrait with hands" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-05.jpg" alt="Close-up portrait with floral details" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-08.jpg" alt="Portrait in a green dress behind tinted glass" loading="lazy" />
            </figure>
          </div>
        </div>
      </section>

      <section class="portrait-series-compact reflection-series" aria-label="Portrait photographs using mirrors and material">
        <div class="portrait-horizontal-strip" tabindex="0" aria-label="Scrollable portrait gallery">
          <figure>
            <img src="/assets/images/portraits/portrait-12.jpg" alt="Portrait framed by reflective silver material" loading="lazy" />
          </figure>
          <figure>
            <img src="/assets/images/portraits/portrait-14.jpg" alt="Upside-down portrait with reflected hands" loading="lazy" />
          </figure>
          <figure>
            <img src="/assets/images/portraits/portrait-13.jpg" alt="Portrait divided by a translucent red panel" loading="lazy" />
          </figure>
        </div>
      </section>

      <section class="portrait-series-compact dark-series" aria-label="Low-key portrait photographs">
        <div class="portrait-gallery-wide">
          <div class="portrait-offset-grid">
            <figure>
              <img src="/assets/images/portraits/portrait-21.jpg" alt="Low-key three-quarter portrait in dark green" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-20.jpg" alt="Dark portrait surrounded by falling rose petals" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-19.jpg" alt="Close-up portrait with a red rose" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-17.jpg" alt="Low-key portrait holding a red rose" loading="lazy" />
            </figure>
            <figure>
              <img src="/assets/images/portraits/portrait-18.jpg" alt="Low-key close portrait in dark green" loading="lazy" />
            </figure>
          </div>
        </div>
      </section>

      <section class="portrait-end">
        <p>End of selection</p>
        <a class="button coral-button" href="/lens/videos/">Continue to Video Projects</a>
      </section>
    </main>

    <footer class="site-footer dark-footer">
      <div class="container footer-wrap">
        <p>© <span data-year></span> Siman Liu</p>
        <p><a href="/lens/">Through My Lens</a></p>
      </div>
    </footer>
  </body>
</html>
